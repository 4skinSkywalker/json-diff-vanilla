<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./json-diff.css">
</head>
<body>
    <div class="json-diff-container" data-id="test">
        <div class="actions">
            <button type="button" class="show-btn"></button>
            <button type="button" class="swap-btn"></button>
            <span class="diff-status status"></span>
        </div>
        <div class="diff-view">
            <div class="diff-header">
                <div class="diff-column left-column"></div>
                <div class="diff-column right-column"></div>
            </div>
            <div class="diff-content"></div>
        </div>
    </div>

    <div class="json-input-panel">
        <label class="json-input-field">
            <span>Left JSON</span>
            <textarea id="left-json" spellcheck="false" aria-label="Left JSON"></textarea>
        </label>
        <label class="json-input-field">
            <span>Right JSON</span>
            <textarea id="right-json" spellcheck="false" aria-label="Right JSON"></textarea>
        </label>
    </div>

    <script src="./json-compare.js"></script>
    <script>
        window.onload = function() {
            const jsonCompareUI = new JsonCompareUI('test', { left: 'Left JSON', right: 'Right JSON' });
            const leftInput = document.getElementById('left-json');
            const rightInput = document.getElementById('right-json');
            const leftJson = `{
  "name": "John",
  "age": 30,
  "city": "New York",
  "test": [
    "porcodrillo",
    "tony",
    {
        "alfa": 1,
        "prova": 3
    },
    {
        "beta": 1,
        "prova": 3
    }
  ],
  "yada": 1,
  "provaprova": "ciao",
  "total2": 2,
  "zeta": "New York"
}`;
            const rightJson = `{
  "name": "Ema",
  "age": 50,
  "zeta": "New York",
  "magnaCappe": 8,
  "test": [
    "mandrillo",
    "tony",
    {
        "prova": 1,
        "test": 2
    },
    {
        "delta": 1
    }
  ],
  "yada": 1,
  "provaprova": "ciao",
  "total": 1
}`;

            leftInput.value = leftJson;
            rightInput.value = rightJson;

            const updateDiff = () => jsonCompareUI.diff(leftInput.value, rightInput.value);
            leftInput.addEventListener('input', updateDiff);
            rightInput.addEventListener('input', updateDiff);
            updateDiff();
        };
    </script>
</body>
</html>
